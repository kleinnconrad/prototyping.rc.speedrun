name: Deploy Dashboard to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - 'setup_sheets/*_setup_sheet.yaml'
      - 'setup_sheets/*_setup_sheet.yml'
      - 'scripts/update_latest_setup.py'
      - 'scripts/generate_setup_drawing.py'
      - 'cad/shock_tower/shock_tower_front_geometry.json'
      - 'cad/shock_tower/shock_tower_rear_geometry.json'
      - 'cad/bulkhead/bulkhead_lower_parameters.json'
      - 'specs/mechanics/carten_t410r/spec_cartent410r.yaml'
      - 'specs/mechanics/wheels/spec_tires.yaml'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # latest_setup.json and latest_setup_drawing.svg are regenerated here instead of relying
      # on the commits of update_dashboard.yml and build_setup_drawing.yml: pushes made with
      # the GITHUB_TOKEN do not trigger workflows, so those commits never start this deployment.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate latest_setup.json and latest_setup_drawing.svg
        run: |
          pip install pyyaml
          python scripts/update_latest_setup.py
          python scripts/generate_setup_drawing.py --theme dark --output docs/latest_setup_drawing.svg
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the docs folder
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
