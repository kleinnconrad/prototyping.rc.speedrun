adr:
  id: ADR-007
  title: Selection of motor cooling for 3S speedruns
  status: decided
  date: '2026-10-27'
  context: "The targeted goal of 100 km/h requires the use of a 3700kV motor (Hobbywing QuicRun 3660SL G2) on a 3S LiPo (11.1V), which leads to motor speeds of approx. 41,000 rpm and a tall final drive ratio (43T pinion / 68T spur gear, FDR 3.91, wheel load 25.6 %). Under these conditions, a high thermal load of the motor was expected. Excessive motor temperatures can demagnetize the rotor or damage the winding insulation. The cooling concept must therefore match the thermal load observed in test drives.\n"
  considered_alternatives:
  - option_id: 1
    name: No dedicated motor cooling (stock setup)
    type: Stock / No additional components
    evaluation: Initially rated as high-risk, since thermal destruction of the motor
      was expected at 3S and the targeted gear ratio. Test drives showed that the motor
      does not heat up significantly during speedruns and drives the final drive ratio
      without problems. No additional weight, wiring or receiver slot required.
  - option_id: 2
    name: Passive heat sink only (heat sink without fan)
    type: Passive
    evaluation: A clip-on aluminum heat sink increases the surface area of the motor
      housing. Not required, since the motor does not heat up significantly during speedruns.
  - option_id: 3
    name: Passive aluminum heat sink + active 40mm high-speed fan
    type: Active + passive
    evaluation: Selected initially as a precaution and installed as a Hobbywing fan with
      cooling fins for 36mm motors (HW86080120), powered via a free receiver slot. Test
      drives showed that the cooling is obsolete. It was removed.
  decision: No dedicated motor cooling (stock setup)
  rationale: "Test drives showed that the motor does not heat up significantly during speedruns. The motor drives the final drive ratio of 3.91 (43T pinion / 68T spur gear) without problems. The active and passive cooling (Hobbywing fan with cooling fins, HW86080120) that was selected initially as a precaution proved to be obsolete and was removed. Thus, the decision was revised to operate the motor without dedicated cooling.\n"
  consequences:
  - 'Receiver slot: The receiver slot previously used for the fan power supply is available again.'
  - 'Weight and wiring: The fan with cooling fins and its cable are omitted. This reduces the vehicle
    weight and the number of cables that must be secured in the chassis.'
  - 'Re-evaluation: The decision applies to the current final drive ratio (3.91) on 3S. A taller
    gear ratio, a higher battery voltage or a different motor requires a re-evaluation of the
    motor cooling.'
