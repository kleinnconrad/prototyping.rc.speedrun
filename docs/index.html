<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedrun Setup Dashboard</title>
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>Carten T410R Setup Dashboard</h1>
        </div>
    </header>

    <main class="dashboard">
        <!-- Setup drawing, generated by scripts/generate_setup_drawing.py -->
        <section class="card" id="drawing-info">
            <a href="latest_setup_drawing.svg" target="_blank" rel="noopener" class="drawing-link">
                <img id="setup-drawing" class="setup-drawing" src="latest_setup_drawing.svg"
                     alt="Technical drawing of the latest Carten T410R setup">
            </a>
            <p class="drawing-hint">Click the drawing to open it in full size.</p>
        </section>
    </main>

    <!-- Error State -->
    <div id="error" class="error" style="display: none;">
        <h2>Error Loading Setup Drawing</h2>
        <p>Could not load the latest setup drawing. Please ensure the GitHub Action has run successfully.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
