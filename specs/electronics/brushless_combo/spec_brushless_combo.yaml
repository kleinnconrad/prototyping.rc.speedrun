spec:
  meta:
    description: Specification of the brushless powertrain for 100 km/h on 3S.
    architecture_status: 'ADR-002: Hobbywing QuicRun WP10BL120 G2 Combo (3660SL 3700KV)
      accepted'
  properties:
    electronic_speed_controller_esc:
      type: Brushless ESC (Sensorless)
      ampere_continuous: Min. 120A
      lipo_support: 2S - 3S (optional up to 4S)
      bec_voltage: '6.0V or 7.4V (adjustable for servo - CAUTION: Leave at 6.0V, the
        Savöx SC-1252MG+ servo is rated for 4.8V - 6.0V!)'
      connector_system_battery: XT60 (Soldered from the factory for the G2 Combo)
      connector_system_motor: 4.0mm gold contact
      reference_model: Hobbywing QuicRun WP10BL120 G2
      packaging_note: Due to the longer motor, the ESC in the T410R chassis must
        be mounted as far back as possible or slightly offset.
      shopping_item:
        add_to_list: true
        item_name: Hobbywing QuicRun Brushless Combo WP10BL120 G2 (incl. 3660SL
          3700KV Motor)
        category: Drivetrain & Electronics
        reference_link: https://www.rcfox.de/HW38030211-HobbyWing-Quicrun-Brushless-Combo-WP10BL120G2-mit-3660SL-3700KV-G2
        estimated_price_eur: 89.0
    brushless_motor:
      size: 3660 (36 mm diameter, 60 mm length)
      kv_rating: 3700KV
      shaft_diameter: 5.0 mm (Absolutely requires 48dp pinion with 5mm bore!)
      pole_count: 4-Pole (for high torque)
      reference_model: Hobbywing 3660SL G2 (3700KV)
      thermal_tolerance: Max. 25.0 % calculated wheel load
      shopping_item:
        add_to_list: false
    motor_pinion:
      type: Large Bore Pinion Gear
      pitch_profile: 48dp
      tooth_count: 43T
      bore: 5.0 mm (Mandatory for the shaft of the Hobbywing 3660 motor!)
      material: Hardened Steel
      shopping_item:
        add_to_list: true
        item_name: Robinson Racing RRP-2043 (48dp, 43T, 5mm Bore)
        category: Drivetrain & Mechanics
        reference_link: https://www.ebay.com/itm/234242275376
        estimated_price_eur: 15.0
