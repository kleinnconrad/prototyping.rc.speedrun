spec:
  meta:
    brand: Carten
    model: T410R Touring Car Kit
    part_number: NHA413
    instruction_manual: >-
      CARTEN T410 Instruction Manual-FINAL (PDF, also covers the T410R). Not stored in this repository
      (copyright of the manufacturer). Available from the manufacturer (https://www.carten-rc.com)
      and from distributors, for example on the download page of Blaze-RC (http://blazerc.com/download).
  properties:
    carten_t410r:
      general:
        vehicle_type: 1:10 Electric Touring Car (EP Touring Car)
        delivery_condition: Kit - unassembled
        deployment_area: On-Road / Asphalt / Carpet
      dimensions:
        track_width_mm: 190
        wheelbase_mm: 258
      chassis_and_structure:
        bottom_plate: 2.03 mm Eco-Carbon (carbon fiber reinforced composite material, measured with a caliper)
        upper_deck: 2.0 mm Eco-Carbon
        shock_towers: 3.0 mm Eco-Carbon (front & rear, various mounting points)
        motor_mount: CNC-machined aluminum
        servo_mount: Floating Servo Mount (Aluminum)
        battery_mount: Prepared for 2S Standard LiPo (Stickpack) or Shorty LiPo
        body_mounts: Adjustable plastic posts
      drivetrain:
        drive_type: 4WD four-wheel drive, central shaft drive
        center_driveshaft: Aluminum (red anodized)
        differentials: Sealed bevel differentials (front & rear)
        differential_gears: Metal gears
        driveshafts: Steel CVD (Constant Velocity Drives) on front and rear axle
        spur_gear_mount: Aluminum
        wheel_hubs: 12 mm hex, aluminum
        internal_ratio: 1:2.47 to 1:2.53
        ball_bearings: Fully ball-beared (with rubber seals)
      suspension_and_springs:
        shock_absorbers: Aluminum oil shock absorbers (with threaded coilover)
        suspension_arm_mounts: Aluminum (Toe Blocks)
        sway_bars: Front and rear included
        geometry_adjustment: Continuously adjustable via R/L threaded rods (Turnbuckles)
        adjustable_parameters:
        - Camber
        - Toe
        - Caster
        - Droop
        - Ride Height
        - Ackermann
      steering:
        steering_system: Ball-bearing Dual-Bellcrank-System (Double arm)
        steering_knuckles_c_hubs: Composite plastic
