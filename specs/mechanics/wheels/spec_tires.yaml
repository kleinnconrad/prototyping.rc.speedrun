    setup_instructions:
      ballooning_protection: Foam rubber tires physically do not expand at approx. 8,300 RPM (axle speed at 100 km/h). The aerodynamics of the ZooRacing Hellcat and the ride height remain constantly safe.
      wheel_nut_securing: Mandatory to use locknuts with an intact nylon ring (M4) and tighten firmly. The brutal acceleration of the 3660 motor can spin off loose nuts immediately.
      balancing: Despite industrial production, tires can have slight imbalances. In case of strong vibrations on the jacked-up chassis, balance the wheels (e.g. with putty lead in the rim) so as not to destroy the wheel bearings of the Carten T410R at 100 km/h.
      break_in_scrubbing: The smooth production layer must first be worn off. Use the first test runs to calibrate the ESC to build up the grip for the final topspeed run.
