Tools:
  meta:
    description: Required tools for assembling the Carten T410R.
  properties:
    tool_list:
      hex_wrenches:
        type: Hex Wrenches
        sizes: 1.5 mm, 2.0 mm, 2.5 mm
        note: Mandatory purchase! Carten uses metric M3 machine screws throughout
          the car (no self-tapping screws). A high-quality hex wrench is highly important
          here, so as not to damage the screw heads and the hard plastic thread when
          screwing in.
        brand: Neewer
        model: Titanium RC Hex Wrench Set (1.5/2.0/2.5/3.0)
      box_wrenches:
        type: RC Cross Wrench / Box Wrench
        sizes: 5.5 mm and 7.0 mm
        note: The 5.5 mm is needed permanently for all M3 nuts in the chassis. The
          7.0 mm is for the wheel nuts. The 10.0 mm mentioned in the Carten manual
          is not needed at all for this 1/10 model.
        status: Available (No purchase necessary)
      adhesives_and_chemicals:
        threadlocker:
          type: Screw Cement / Threadlocker
          note: highly important! Goes on all screws that are screwed into metal (e.g.
            motor pinion). Often incorrectly labeled as 'GLUE' in the Carten manual.
            Never use for plastic!
          brand: Loctite
          model: 243 Medium Strength (Blue)
      tapes:
        glass_tape:
          type: Glass Tape
          note: Mandatory for the T410R! The car has no classic plastic battery holders.
            According to the manual, the tape is pulled through the slots in the carbon
            chassis to strap the LiPo battery down tightly.
          brand: Arrowmax
          model: Fibre Tape / Battery Tape
Tires:
  meta:
    brand: Team Corally
    model: Attack Moosgummi Reifen (C-14705-35)
    type: Foam rubber tire
    tread: Slick
    shore_hardness: 35 shore
    wheel_hub: 12mm Hex - Suitable for kit hubs of the Carten T410R
    assembly_status: Pre-glued (Industrially glued at the factory on spoke wheels)
    shopping_item:
      add_to_list: true
      item_name: Team Corally C-14705-35 Attack Moosgummi Reifen - 1/10 GP Toerenwagen
        - 35 shore
      category: Wheels & Tires
      reference_link: Search for Team Corally C-14705-35 at common RC shops
      estimated_price_eur: 31.98
  properties:
    dimensions:
      diameter_mm: 64
      width_front_mm: 30
      width_rear_mm: 30
    setup_instructions:
      ballooning_protection: Foam rubber tires physically do not expand at approx.
        8,300 RPM (axle speed at 100 km/h). The aerodynamics of the ZooRacing Hellcat
        and the ride height remain constantly safe.
      wheel_nut_securing: Mandatory to use locknuts with an intact nylon ring (M4)
        and tighten firmly. The brutal acceleration of the 3660 motor can spin off
        loose nuts immediately.
      balancing: Despite industrial production, tires can have slight imbalances.
        In case of strong vibrations on the jacked-up chassis, balance the wheels
        (e.g. with putty lead in the rim) so as not to destroy the wheel bearings
        of the Carten T410R at 100 km/h.
      break_in_scrubbing: The smooth production layer must first be worn off. Use
        the first test runs to calibrate the ESC to build up the grip for the final
        topspeed run.
