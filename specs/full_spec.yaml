      protocol: 2.4Ghz
      range_ground: '>200m'
      response_time: Low latency for high precision
      power_supply: Transmitter batteries according to manufacturer specifications
      potentiometer: Hall Sensor for highest possible precision
    calibration_and_setup:
      fail_safe_activation: The fail-safe must absolutely be programmed to brake!
