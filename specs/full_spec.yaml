Gps:
  meta:
    type: GNSS Performance Analyzer (GPS/GLONASS)
    reference_model: Ruddog GPS Performance Analyzer
    measuring_frequency: 10 Hz (10 Updates per second - critical for RC speedruns!)
    interface: Bluetooth 4.0 (Readout via iOS/Android App)
    power_supply: Integrated LiPo battery (chargeable via USB)
    weight: approx. 38 Grams
    shopping_item:
      add_to_list: true
      item_name: Ruddog GPS Performance Analyzer
      category: Testing & Validation
      reference_link: Search at RC model specialist dealer (e.g. RC-KleinKram, Tamico,
        Monster Hopups)
      estimated_price_eur: 50
  properties:
    app_integration:
      software: RC Gears / Ruddog App (or identical SkyRC App)
      functions: Top-Speed measurement, 0-100 km/h time measurement, Track-Logging
    mounting_and_setup:
      positioning: 'Must be mounted in a location that has a clear view of the sky.
        Carbon components (like the upper deck of the Carten) shield the satellite
        signal! Best mounting location: On the front foam bumper.'
      fixation: The module must absolutely be secured with velcro AND an additional
        cable tie or tape during speedruns. The G-forces during a crash are enormous.
      operation: The module flashes during the satellite search. Only start driving
        when the GPS signal is confirmed as 'Locked' (usually by a solid light), otherwise
        the first meters are missing from the measurement.
Glitch Buster:
  meta:
    brand: Ruddog
    model: Glitch Buster
    type: Receiver Capacitor / Voltage Stabilizer
    features: Prevents voltage drops and receiver brown-outs
    price_class: Low-Budget (~5 EUR)
  properties:
    mechanical_specifications:
      connector: Standard JR/Futaba servo plug
      case: Shrink-wrapped electrolytic capacitor
    performance_specifications:
      function: Buffers the BEC (Battery Eliminator Circuit) voltage to prevent sudden
        drops caused by high current draw from the steering servo.
      compatibility: Universally compatible with all standard RC receivers.
    installation:
      mounting: Plugs directly into any available free port on the receiver (e.g.,
        CH4, AUX, or BATT).
      application: Highly recommended when using a gyro, as the constant micro-adjustments
        and counter-steering commands can lead to high-frequency current spikes, causing
        voltage fluctuations and subsequent servo jitter or receiver reboots.
